name: Verify Knowledge Scope

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Record actual candidate runtime
        run: node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,architecture:process.arch}))'
      - run: npm run verify
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-npm-artifact-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/schift-ks-release-*/artifacts/*
          if-no-files-found: error
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.11
      - run: uv python install 3.12
      - run: uv run --project packages/core/context-pack/python --extra dev --python 3.12 pytest packages/core/context-pack/python/tests
      - run: uv run --project packages/core/context-pack/python --extra dev ruff check packages/core/context-pack/python
      - run: uv run --project packages/core/context-pack/python --extra dev basedpyright --project packages/core/context-pack/python --pythonpath packages/core/context-pack/python/.venv/bin/python
      - run: uv build --project packages/core/context-pack/python --wheel
